# Exponential-decay cumulative sum: x [B, H, L, D], log_decay [H, D] → y [B, H, L, D]
# y[b,h,t,d] = sum_{s=0}^{t} x[b,h,s,d] * exp((t-s)*log_decay[h,d])
# Equivalently: y[t] = decay * y[t-1] + x[t]  where decay = exp(log_decay).

[[cases]]
id    = "small"
desc  = "small sequence, few heads"
dtype = "fp16"
[cases.shapes]
B = 4
H = 4
L = 64
D = 64

[[cases]]
id    = "medium"
desc  = "medium model dimensions"
dtype = "fp16"
[cases.shapes]
B = 2
H = 8
L = 512
D = 128

[[cases]]
id    = "long_seq"
desc  = "long sequence — tests chunk boundary correctness"
dtype = "fp16"
[cases.shapes]
B = 2
H = 4
L = 2048
D = 64

[[cases]]
id    = "single_token"
desc  = "L=1: output equals input, decay factor is 1"
dtype = "fp16"
[cases.shapes]
B = 8
H = 4
L = 1
D = 64

[[cases]]
id    = "wide_head_dim"
desc  = "large head dimension"
dtype = "fp16"
[cases.shapes]
B = 2
H = 4
L = 256
D = 256

[[cases]]
id    = "bf16"
desc  = "bfloat16 dtype"
dtype = "bf16"
[cases.shapes]
B = 2
H = 8
L = 256
D = 128

[stress]
num_trials     = 30
pass_threshold = 0.90

[stress.shape_ranges]
B = [1, 8]
H = [1, 16]
L = [1, 1024]
D = [16, 256]
