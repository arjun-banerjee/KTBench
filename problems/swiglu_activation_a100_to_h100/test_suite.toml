# SwiGLU: input [N, 2*D] -> output [N, D]
# Shapes are tagged N (num tokens) and D (per-side hidden dim).
# Values are freshly randomized every trial.

[[cases]]
id    = "vllm_default"
desc  = "Matches KernelBench io contract: NUM_TOKENS=512, D=2048"
dtype = "fp16"
[cases.shapes]
N = 512
D = 2048

[[cases]]
id    = "small"
desc  = "Smaller batch / hidden"
dtype = "fp16"
[cases.shapes]
N = 64
D = 512

[[cases]]
id    = "tall_thin"
desc  = "Many tokens, narrow hidden"
dtype = "fp16"
[cases.shapes]
N = 4096
D = 128

[[cases]]
id    = "wide"
desc  = "Few tokens, wide hidden"
dtype = "fp16"
[cases.shapes]
N = 16
D = 8192

[[cases]]
id    = "nonpow2"
desc  = "Off-power-of-two — breaks naive tiling"
dtype = "fp16"
[cases.shapes]
N = 257
D = 1023

[[cases]]
id    = "single_row"
desc  = "Degenerate single token"
dtype = "fp16"
[cases.shapes]
N = 1
D = 512

[stress]
num_trials     = 30
pass_threshold = 0.90

[stress.shape_ranges]
N = [1, 4096]
D = [16, 8192]
