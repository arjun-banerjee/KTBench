problem_id   = "swiglu_activation_a100_to_h100"
name         = "SwiGLU Activation (CUDA A100 → CUDA H100)"
src_dsl      = "cuda"
src_hw       = "nvidia_a100_sxm"
tgt_dsl      = "cuda"
tgt_hw       = "nvidia_h100_sxm"
tags         = ["activation", "elementwise", "fp16", "hw-translation", "moe"]
difficulty   = 1
provenance   = "io contract from KernelBench level5/hardware_translation/io/04_swiglu_activation.toml; oracle from /oracle/04_swiglu_activation.py"

# SwiGLU mixes magnitudes (silu * up can produce values across a wide
# range) and the input dtype is fp16; the default 1e-2 tolerance is
# too tight when intermediate sigmoid math is done in fp32 and cast
# back, or vice versa. 1e-1 still catches real bugs without
# penalising fp32-internal kernels for normal fp16 round-trip error.
[tolerances.fp16]
atol = 1e-1
rtol = 1e-1

[tolerances.bf16]
atol = 1e-1
rtol = 1e-1
