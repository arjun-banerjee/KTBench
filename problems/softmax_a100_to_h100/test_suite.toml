# Softmax: input shape is [N, D], output shape is [N, D].
# Structured cases: FIXED shapes, but tensor VALUES are always freshly randomized.

[[cases]]
id    = "small"
desc  = "small square"
dtype = "fp16"
[cases.shapes]
N = 128
D = 256

[[cases]]
id    = "large_D"
desc  = "wide rows — reduction over large D"
dtype = "fp16"
[cases.shapes]
N = 512
D = 4096

[[cases]]
id    = "tall"
desc  = "many short rows"
dtype = "fp16"
[cases.shapes]
N = 8192
D = 64

[[cases]]
id    = "nonpow2"
desc  = "non-power-of-2 — breaks naive tiling"
dtype = "fp16"
[cases.shapes]
N = 1000
D = 300

[[cases]]
id    = "single_row"
desc  = "degenerate single row"
dtype = "fp16"
[cases.shapes]
N = 1
D = 512

[[cases]]
id    = "bf16_medium"
desc  = "bfloat16 dtype"
dtype = "bf16"
[cases.shapes]
N = 256
D = 1024

[[cases]]
id    = "extreme_D"
desc  = "very wide row — tests register pressure"
dtype = "fp16"
[cases.shapes]
N = 32
D = 16384

[[cases]]
id    = "unit"
desc  = "single element — numerical edge case"
dtype = "fp16"
[cases.shapes]
N = 1
D = 1

# Stress: both shape AND values are random every trial.
# Shape-specific or value-specific hacks fail here.
[stress]
num_trials     = 30
pass_threshold = 0.90

[stress.shape_ranges]
N = [1, 4096]
D = [1, 8192]
