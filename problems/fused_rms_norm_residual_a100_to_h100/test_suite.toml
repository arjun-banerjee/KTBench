# RMSNorm + residual: inputs x [B, L, D], r [B, L, D], w [D] → y [B, L, D]
# y = rms_norm(x + r) * w    (fp32 accumulation, cast back to input dtype)

[[cases]]
id    = "small"
desc  = "small model hidden size"
dtype = "fp16"
[cases.shapes]
B = 4
L = 128
D = 512

[[cases]]
id    = "llama3_hidden"
desc  = "LLaMA-3 8B hidden dim"
dtype = "fp16"
[cases.shapes]
B = 2
L = 64
D = 4096

[[cases]]
id    = "single_token"
desc  = "inference: single token, large batch"
dtype = "fp16"
[cases.shapes]
B = 32
L = 1
D = 4096

[[cases]]
id    = "large_hidden"
desc  = "very large hidden dim"
dtype = "fp16"
[cases.shapes]
B = 2
L = 32
D = 8192

[[cases]]
id    = "nonpow2_D"
desc  = "non-power-of-2 hidden dim"
dtype = "fp16"
[cases.shapes]
B = 4
L = 64
D = 3000

[[cases]]
id    = "bf16"
desc  = "bfloat16 dtype"
dtype = "bf16"
[cases.shapes]
B = 4
L = 128
D = 4096

[[cases]]
id    = "long_seq"
desc  = "long sequence"
dtype = "fp16"
[cases.shapes]
B = 2
L = 2048
D = 1024

[stress]
num_trials     = 30
pass_threshold = 0.90

[stress.shape_ranges]
B = [1, 8]
L = [1, 256]
D = [64, 4096]
