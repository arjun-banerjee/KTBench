# WKV token-mixing recurrence.
# Inputs: r, k, v [B, H, T, N]  fp16
#         w [H, N]               fp32  (log-decay, always ≤ 0)
#         u [H, N]               fp16  (bonus term)
# Output: y [B, H, T, N]        fp16
#
# Recurrence:
#   state[b,h,n] := 0 initially
#   For t in range(T):
#     kv[n] = k[b,h,t,n] * v[b,h,t,n]          (elementwise)
#     y[b,h,t,n] = r[b,h,t,n] * (u[h,n]*kv[n] + state[b,h,n])
#     state[b,h,n] = exp(w[h,n]) * state[b,h,n] + kv[n]

[[cases]]
id    = "small"
desc  = "small model"
dtype = "fp16"
[cases.shapes]
B = 2
H = 4
T = 64
N = 32

[[cases]]
id    = "medium_seq"
desc  = "medium sequence length"
dtype = "fp16"
[cases.shapes]
B = 2
H = 8
T = 512
N = 64

[[cases]]
id    = "long_seq"
desc  = "long sequence — exercises recurrence correctness"
dtype = "fp16"
[cases.shapes]
B = 2
H = 4
T = 2048
N = 64

[[cases]]
id    = "single_token"
desc  = "T=1: state starts at 0, output = r * u * k * v"
dtype = "fp16"
[cases.shapes]
B = 8
H = 4
T = 1
N = 64

[[cases]]
id    = "large_heads"
desc  = "many heads"
dtype = "fp16"
[cases.shapes]
B = 2
H = 32
T = 128
N = 64

[[cases]]
id    = "bf16"
desc  = "bfloat16 dtype"
dtype = "bf16"
[cases.shapes]
B = 2
H = 8
T = 256
N = 64

[stress]
num_trials     = 30
pass_threshold = 0.90

[stress.shape_ranges]
B = [1, 4]
H = [1, 16]
T = [1, 512]
N = [16, 64]
