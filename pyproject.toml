[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ktbench"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3",
    "numpy>=1.26",
    "safetensors>=0.4",
    "tomli>=2.0; python_version < '3.11'",
    "pydantic>=2.0",
    "rich>=13",
    "neuronx-cc>=1.0.post1",
    "ensemble",
]

[project.optional-dependencies]
triton     = ["triton>=2.3"]
llm        = ["openai>=1.30"]
dev        = ["pytest", "pytest-timeout"]
inspect    = ["inspect-ai>=0.3"]
ensemble   = ["ensemble"]
langgraph  = ["langgraph>=0.2", "langchain-core>=0.3", "langchain-openai>=0.2"]
smolagents = ["smolagents[litellm]>=1.0"]
autogen    = ["autogen-agentchat>=0.4", "autogen-ext[openai]>=0.4"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["ktbench*", "tools*"]

[tool.uv.sources]
ensemble = { path = "../ensemble" }
