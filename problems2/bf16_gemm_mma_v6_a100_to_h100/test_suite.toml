# bf16_gemm_mma_v6_a100_to_h100
# A100: https://github.com/gau-nernst/learn-cuda/blob/main/02b_matmul_sm80/matmul_v6.cu
# H100: https://github.com/HamzaElshafie/h100_gemm/blob/main/src/kernels/hopper/gemm_bf16_pc_pipeline.cuh
# C = A @ B  (BF16)  —  A[M,K], B[K,N] row-major → C[M,N] row-major

[[cases]]
id    = "sq512"
desc  = "square 512"
dtype = "bf16"
[cases.shapes]
M = 512
K = 512
N = 512

[[cases]]
id    = "sq1024"
desc  = "square 1024"
dtype = "bf16"
[cases.shapes]
M = 1024
K = 1024
N = 1024

[[cases]]
id    = "rect1"
desc  = "M!=N"
dtype = "bf16"
[cases.shapes]
M = 1024
K = 512
N = 256

[[cases]]
id    = "rect2"
desc  = "N!=M"
dtype = "bf16"
[cases.shapes]
M = 256
K = 512
N = 1024

[[cases]]
id    = "sq2048"
desc  = "square 2048"
dtype = "bf16"
[cases.shapes]
M = 2048
K = 512
N = 2048

[stress]
num_trials     = 15
pass_threshold = 0.9

[stress.shape_ranges]
M = [128, 1024]
K = [64, 1024]
N = [128, 1024]
# Note: all dimensions must be multiples of 128
