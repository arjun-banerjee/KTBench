# bf16_gemm_reg2d_a100_to_h100
# A100: https://github.com/HamzaElshafie/h100_gemm/blob/main/src/kernels/general/gemm_2D_registertiling_bf16.cuh
# H100: https://github.com/HamzaElshafie/h100_gemm/blob/main/src/kernels/hopper/gemm_bf16_wgmma_tma.cuh
# C = A @ B  (BF16)  —  A[M,K], B[K,N] row-major → C[M,N] row-major

[[cases]]
id    = "sq512"
desc  = "square 512"
dtype = "bf16"
[cases.shapes]
M = 512
K = 512
N = 512

[[cases]]
id    = "sq1024"
desc  = "square 1024"
dtype = "bf16"
[cases.shapes]
M = 1024
K = 1024
N = 1024

[[cases]]
id    = "rect_MN"
desc  = "M>N"
dtype = "bf16"
[cases.shapes]
M = 1024
K = 512
N = 256

[[cases]]
id    = "rect_NK"
desc  = "N>K"
dtype = "bf16"
[cases.shapes]
M = 512
K = 256
N = 1024

[[cases]]
id    = "tall"
desc  = "tall matrix"
dtype = "bf16"
[cases.shapes]
M = 2048
K = 128
N = 64

[[cases]]
id    = "wide"
desc  = "wide matrix"
dtype = "bf16"
[cases.shapes]
M = 64
K = 128
N = 2048

[stress]
num_trials     = 20
pass_threshold = 0.9

[stress.shape_ranges]
M = [64, 1024]
K = [64, 512]
N = [64, 1024]
# Note: all dimensions must be multiples of 64
